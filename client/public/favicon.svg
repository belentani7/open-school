<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Open School">
  <defs>
    <radialGradient id="core" cx="42%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#c3b3ff"/>
      <stop offset="70%" stop-color="#9e86ff"/>
      <stop offset="100%" stop-color="#3b2f78"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sustrato: negro 97%, como el resto del sistema -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <rect width="64" height="64" rx="14" fill="#030328" opacity=".85"/>

  <!-- La marca: rombo abierto. Un aula vista desde arriba. -->
  <g filter="url(#bloom)">
    <path d="M32 12 52 32 32 52 12 32Z" fill="none" stroke="url(#core)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M32 23 41 32 32 41 23 32Z" fill="url(#core)" opacity=".92"/>
  </g>

  <!-- Bisel: la luz entra por arriba a la izquierda -->
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
</svg>
