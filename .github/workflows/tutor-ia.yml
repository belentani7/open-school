name: tutor-ia

on:
  schedule:
    - cron: "0 8 * * *"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capsula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name != 'issues'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Capsula didactica del dia
        env:
          GH_TOKEN: ${{ github.token }}
        run: python campus/agente/tutor.py capsula

  tutor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Responder si tiene la etiqueta tutor
        env:
          ETIQUETAS: ${{ toJSON(github.event.issue.labels) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$ETIQUETAS" | grep -qi "tutor" && python campus/agente/tutor.py issue || echo "sin etiqueta tutor"
