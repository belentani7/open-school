name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    name: Verificacion completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
