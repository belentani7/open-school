name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verificacion completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify full-platform security baseline
        run: node scripts/verify-platform-security.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Verify no tracked coupling or backup archives
        run: node scripts/verify-no-archives.mjs
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tutor syntax
        run: python -m py_compile campus/agente/tutor.py
      - name: Backend tests and lint
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir -e '.[dev]'
          python -m pytest -q
          python -m ruff check app tests ../api
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build


  education-contract:
    name: Validate education contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Only Node's built-in test runner is needed; avoid an uninitialized pnpm cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test contract validator
        run: node --test scripts/verify-education-contract.test.mjs
      - name: Validate project ledger
        run: node scripts/verify-education-contract.mjs

  browser-journeys:
    name: Real student journeys (desktop and mobile Chromium)
    needs: [verify, education-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production campus
        run: pnpm build
      - name: Confirm preinstalled Chrome
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Exercise real desktop and mobile learner journeys
        run: pnpm exec playwright test --project=chromium --project="Mobile Chrome"
        env:
          CI: true
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: open-school-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
