name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enlaces relativos rotos y assets ausentes
        run: python tools/verify_site.py --root . || echo "sin verifier"
      - name: Barrera de secretos (R4)
        run: |
          if grep -rEn "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}" .              --exclude-dir=.git --exclude-dir=node_modules; then
            echo "SECRETO DETECTADO"; exit 1
          fi
