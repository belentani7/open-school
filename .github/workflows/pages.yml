name: Build & Deploy Pages (Vite)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Build app React (base relativa)
        run: pnpm exec vite build --base=./
        env:
          NODE_ENV: production
      - name: Ensamblar sitio (app React + campus PWA + biblioteca)
        run: |
          mkdir -p _pages
          cp -r dist/client _pages/app
          cp -r dist/client/learning-library _pages/learning-library
          cp -r campus _pages/campus
          cp index.html _pages/index.html
          cp index.html _pages/404.html
          node scripts/prepare-pages-library.mjs _pages/learning-library
      - name: Confirmar salida educativa
        run: node -e "const m=require('./_pages/learning-library/manifest.json'); if(m.pageCount!==204) process.exit(1); console.log(m.pageCount+' páginas educativas verificadas')"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _pages
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
